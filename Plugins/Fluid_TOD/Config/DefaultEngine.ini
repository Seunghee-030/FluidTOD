[CoreRedirects]
; UMyBlueprintFunctionLibrary -> UTODCurveFunctionLibrary rename (Fluid_TOD).
; Keeps existing Blueprint graphs that call the old class name working after upgrading the plugin.
+ClassRedirects=(OldName="/Script/Fluid_TOD.MyBlueprintFunctionLibrary",NewName="/Script/Fluid_TOD.TODCurveFunctionLibrary")
